<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Vila Flora – Gestão Condominial</title>
<meta name="theme-color" content="#1a1a2e"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:#f0eff4;color:#1a1a2e;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;outline:none;}
::-webkit-scrollbar{width:5px;height:4px;}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px;}
.tap:active{opacity:0.7;transform:scale(0.97);}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sidebar{width:220px;background:#1a1a2e;color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:10;}
.main-area{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:#fff;border-bottom:1px solid #eee;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.pill{padding:6px 14px;border-radius:999px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.btn-primary{padding:10px 22px;border-radius:12px;background:#6c63ff;color:#fff;font-weight:700;font-size:13px;}
.section{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.section-title{font-weight:800;font-size:14px;margin-bottom:14px;border-bottom:1px solid #f0eff4;padding-bottom:10px;}
.field-label{font-size:10px;color:#888;letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:5px;font-weight:700;}
.field-input{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid #e8e7f0;background:#f8f8fc;font-size:14px;color:#1a1a2e;margin-bottom:12px;display:block;}
.field-input:focus{border-color:#6c63ff;}
.infobox{background:#f8f8fc;border-radius:10px;padding:8px 12px;font-size:11px;color:#888;line-height:1.6;margin-bottom:12px;}
.mono{font-family:'DM Mono',monospace;}
.overlay{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;}
.overlay-bg{position:absolute;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(3px);}
.modal-box{position:relative;background:#fff;border-radius:20px;padding:28px 30px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;box-shadow:0 25px 80px rgba(0,0,0,0.2);animation:fadeUp 0.2s ease;}
.sheet-box{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:22px 22px 0 0;padding:0 20px 36px;max-height:90vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,0.15);animation:fadeUp 0.2s ease;z-index:301;}
.sheet-handle{width:36px;height:4px;background:#e0e0e0;border-radius:999px;margin:12px auto 16px;}
table{width:100%;border-collapse:collapse;}
th{padding:13px 16px;text-align:left;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#a78bfa;font-weight:600;background:#1a1a2e;}
td{padding:13px 16px;border-top:1px solid #f4f4f8;font-size:13px;}
tr:nth-child(even) td{background:#faf9fc;}
tr:hover td{background:#f5f3ff;cursor:pointer;}
.progress-track{height:10px;background:#f0eff4;border-radius:999px;overflow:hidden;display:flex;}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:700;}
.st-paid{background:#dcfce7;color:#14532d;}
.st-pending{background:#fef9c3;color:#713f12;}
.st-overdue{background:#fee2e2;color:#7f1d1d;}
.nav-btn{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#aaa;}
.nav-btn.active{color:#6c63ff;}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:999;padding:12px 22px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,0.25);display:none;white-space:nowrap;max-width:90vw;text-align:center;}
#loading{position:fixed;inset:0;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;}
.spinner{width:36px;height:36px;border:4px solid #2e2e46;border-top:4px solid #6c63ff;border-radius:50%;animation:spin 0.8s linear infinite;}
@media(max-width:767px){
  .grid-4{grid-template-columns:1fr 1fr;}
  .grid-2{grid-template-columns:1fr;}
  .grid-auto{grid-template-columns:1fr;}
  .desktop-only{display:none!important;}
  .main-area{margin-left:0;}
}
@media(min-width:768px){
  .mobile-only{display:none!important;}
}
</style>
</head>
<body>

<div id="toast"></div>

<div id="loading">
  <div style="font-size:32px;font-weight:900;color:#a78bfa;margin-bottom:4px">Vila Flora</div>
  <div style="font-size:11px;color:#6b6b8a;letter-spacing:3px;text-transform:uppercase;margin-bottom:32px">Gestão Condominial</div>
  <div class="spinner"></div>
  <div id="loading-msg" style="font-size:12px;color:#6b6b8a;margin-top:16px">Iniciando ao Firebase...</div>
</div>

<div id="app" style="display:none;min-height:100vh;"></div>

<!-- Firebase SDK -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYx8emBtMkF_Tz3JiqV6dbF1MGgRPcA_o",
  authDomain: "vilaflora-5d6f0.firebaseapp.com",
  projectId: "vilaflora-5d6f0",
  storageBucket: "vilaflora-5d6f0.firebasestorage.app",
  messagingSenderId: "962899013984",
  appId: "1:962899013984:web:4009a9407efe3e77726e05",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ─── Constants ────────────────────────────────────────────────────────────────
const MONTHS_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const MONTHS_S  = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const CUR_YEAR  = new Date().getFullYear();
const PLUGGY_API = "https://api.pluggy.ai";

const STATUS = {
  paid:    {bg:"#dcfce7",text:"#14532d",dot:"#22c55e",label:"Pago",    icon:"✓",cls:"st-paid"},
  pending: {bg:"#fef9c3",text:"#713f12",dot:"#eab308",label:"Pendente",icon:"⏳",cls:"st-pending"},
  overdue: {bg:"#fee2e2",text:"#7f1d1d",dot:"#ef4444",label:"Atrasado",icon:"!",cls:"st-overdue"},
};

const DEFAULT_SETTINGS = {
  pluggyClientId:"",pluggyClientSecret:"",pluggyItemId:"",
  gmailClientId:"",whatsappToken:"",whatsappPhoneId:"",
  senderName:"Administração Vila Flora",baseAmount:300,overdueIntervalDays:2,
  emailReminderTpl:"Olá {nome},\n\nLembrete: sua taxa condominial de {valor} vence em {vencimento}.\n\nAtenciosamente,\n{remetente}",
  emailOverdueTpl:"Olá {nome},\n\nSua taxa de {valor} está em ATRASO desde {vencimento}.\n\nAtenciosamente,\n{remetente}",
  waReminderTpl:"Olá {nome}! 👋\n\nLembrete: taxa de *{valor}* vence em *{vencimento}*.\n\n_{remetente}_",
  waOverdueTpl:"Olá {nome}! ⚠️\n\nSua taxa de *{valor}* está em *ATRASO* desde *{vencimento}*.\n\n_{remetente}_",
};

const INIT_RESIDENTS = [
  {id:1, apt:"1", owner:"",email:"",phone:"",amount:300.01},
  {id:2, apt:"2", owner:"",email:"",phone:"",amount:300.02},
  {id:3, apt:"3", owner:"",email:"",phone:"",amount:300.03},
  {id:4, apt:"4", owner:"",email:"",phone:"",amount:300.04},
  {id:5, apt:"5", owner:"",email:"",phone:"",amount:300.05},
  {id:6, apt:"6", owner:"",email:"",phone:"",amount:300.06},
  {id:7, apt:"7", owner:"",email:"",phone:"",amount:300.07},
  {id:8, apt:"8", owner:"",email:"",phone:"",amount:300.08},
  {id:9, apt:"9", owner:"",email:"",phone:"",amount:300.09},
  {id:10,apt:"10",owner:"",email:"",phone:"",amount:300.10},
];

// ─── Helpers ─────────────────────────────────────────────────────────────────
const fmtBRL  = n => "R$ "+Number(n).toLocaleString("pt-BR",{minimumFractionDigits:2});
const invKey  = (rid,m,y) => rid+"-"+m+"-"+y;
const todayStr= () => new Date().toISOString().slice(0,10);
const daysDiff= d => d ? Math.floor((new Date(todayStr())-new Date(d))/86400000) : null;
const fmtDate = d => d ? new Date(d+"T12:00:00").toLocaleDateString("pt-BR") : "—";
const fillTpl = (tpl,vars) => Object.entries(vars).reduce((t,[k,v])=>t.split("{"+k+"}").join(v),tpl);
const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// ─── Firebase helpers ─────────────────────────────────────────────────────────
async function fbGet(docPath) {
  const snap = await getDoc(doc(db, ...docPath.split("/")));
  return snap.exists() ? snap.data() : null;
}
async function fbSet(docPath, data) {
  await setDoc(doc(db, ...docPath.split("/")), data, {merge:true});
}
function fbListen(docPath, cb) {
  return onSnapshot(doc(db, ...docPath.split("/")), snap => cb(snap.exists() ? snap.data() : null));
}

// ─── State ────────────────────────────────────────────────────────────────────
let state = {
  tab: 0,
  residents: INIT_RESIDENTS,
  invoices: {},
  settings: {...DEFAULT_SETTINGS},
  notifLog: [],
  selMonth: new Date().getMonth(),
  selYear: CUR_YEAR,
  filterSt: "all",
  modal: null,
  editRes: null,
  detailRow: null,
  connectStep: 0,
  pluggyApiKey: "",
  pluggyAccounts: [],
  pluggySelAcct: "",
  pluggySyncing: false,
  pluggyLastSync: null,
  pluggyMatches: [],
  syncing: false,
};

// Save to Firebase (debounced)
let _saveTimer = {};
function saveToFirebase(key, data) {
  clearTimeout(_saveTimer[key]);
  _saveTimer[key] = setTimeout(async () => {
    try { await fbSet("vilaflora/"+key, {data: JSON.stringify(data)}); } catch(e) { console.warn("Save error:", e); }
  }, 800);
}

function setState(patch, skipSave) {
  Object.assign(state, patch);
  if (!skipSave) {
    if (patch.residents !== undefined) saveToFirebase("residents", state.residents);
    if (patch.invoices  !== undefined) saveToFirebase("invoices",  state.invoices);
    if (patch.settings  !== undefined) saveToFirebase("settings",  state.settings);
    if (patch.notifLog  !== undefined) saveToFirebase("notifLog",  state.notifLog);
  }
  render();
}

// ─── Load from Firebase on start ─────────────────────────────────────────────
function loadFromFirebase() {
  // Show app immediately — do not wait for Firebase
  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";
  render();

  // Connect Firebase in background
  setTimeout(async () => {
    try {
      const [r,i,s,l] = await Promise.all([
        fbGet("vilaflora/residents"),
        fbGet("vilaflora/invoices"),
        fbGet("vilaflora/settings"),
        fbGet("vilaflora/notifLog"),
      ]);
      if (r) state.residents = JSON.parse(r.data);
      if (i) state.invoices  = JSON.parse(i.data);
      if (s) state.settings  = {...DEFAULT_SETTINGS, ...JSON.parse(s.data)};
      if (l) state.notifLog  = JSON.parse(l.data);
      if (!r) saveToFirebase("residents", state.residents);
      render();
    } catch(e) { console.warn("Firebase load error:", e.message); }
    try {
      fbListen("vilaflora/residents", d => { if(d){state.residents=JSON.parse(d.data);render();}});
      fbListen("vilaflora/invoices",  d => { if(d){state.invoices =JSON.parse(d.data);render();}});
      fbListen("vilaflora/settings",  d => { if(d){state.settings={...DEFAULT_SETTINGS,...JSON.parse(d.data)};render();}});
      fbListen("vilaflora/notifLog",  d => { if(d){state.notifLog=JSON.parse(d.data);render();}});
    } catch(e) { console.warn("Listener error:", e); }
  }, 100);
}

// ─── Toast ────────────────────────────────────────────────────────────────────
function showToast(msg, type) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.background = type==="err" ? "#7f1d1d" : "#14532d";
  el.style.color = "#fff";
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display="none", 3500);
}

// ─── Business logic ───────────────────────────────────────────────────────────
function getRows() {
  return state.residents.map(r => {
    const key = invKey(r.id, state.selMonth, state.selYear);
    const inv = state.invoices[key];
    return {r, key, inv, status:inv?inv.status:"pending", amount:inv?inv.amount:r.amount, dueDate:inv?inv.dueDate:"", notes:inv?inv.notes:""};
  });
}

function autoOverdue() {
  const next = {...state.invoices}; let changed = false;
  Object.entries(next).forEach(([k,inv]) => {
    if (inv.status==="pending" && inv.dueDate && daysDiff(inv.dueDate)>0) {
      next[k] = {...inv, status:"overdue"}; changed = true;
    }
  });
  if (changed) setState({invoices:next});
}

function changeStatus(key, r, st) {
  const inv = state.invoices[key] || {residentId:r.id, month:state.selMonth, year:state.selYear, amount:r.amount, dueDate:"", notes:""};
  setState({invoices: {...state.invoices, [key]: {...inv, status:st}}});
}

function addLog(ch, res, type, st) {
  const log = [{id:Date.now(), ts:new Date().toLocaleString("pt-BR"), ch, res, type, st}, ...state.notifLog].slice(0,200);
  setState({notifLog:log});
}

// ─── Gmail ────────────────────────────────────────────────────────────────────
let _gapiReady = false;
async function gapiSend(to, subject, body) {
  if (!_gapiReady) {
    await new Promise((res,rej) => { const s=document.createElement("script"); s.src="https://apis.google.com/js/api.js"; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    _gapiReady = true;
  }
  await new Promise(r => window.gapi.load("client:auth2", r));
  await window.gapi.client.init({clientId:state.settings.gmailClientId, scope:"https://www.googleapis.com/auth/gmail.send", discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/gmail/v1/rest"]});
  const auth = window.gapi.auth2.getAuthInstance();
  if (!auth.isSignedIn.get()) await auth.signIn();
  const raw = btoa(unescape(encodeURIComponent("To: "+to+"\r\nSubject: "+subject+"\r\nContent-Type: text/plain; charset=utf-8\r\n\r\n"+body))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  await window.gapi.client.gmail.users.messages.send({userId:"me", resource:{raw}});
}

async function waSend(to, body) {
  const r = await fetch("https://graph.facebook.com/v19.0/"+state.settings.whatsappPhoneId+"/messages", {method:"POST", headers:{Authorization:"Bearer "+state.settings.whatsappToken,"Content-Type":"application/json"}, body:JSON.stringify({messaging_product:"whatsapp", to:to.replace(/\D/g,""), type:"text", text:{body}})});
  if (!r.ok) throw new Error(await r.text());
}

async function notify(row, type) {
  const {r, amount, dueDate} = row;
  const vars = {nome:r.owner, valor:fmtBRL(amount), vencimento:fmtDate(dueDate), remetente:state.settings.senderName};
  const isOverdue = type==="overdue"; const errors = [];
  if (state.settings.gmailClientId && r.email) {
    try { await gapiSend(r.email, (isOverdue?"⚠️ Atraso":"Lembrete")+" – Casa "+r.apt, fillTpl(isOverdue?state.settings.emailOverdueTpl:state.settings.emailReminderTpl, vars)); addLog("Email","Casa "+r.apt,type,"✅ Enviado"); }
    catch(e) { errors.push(e.message); addLog("Email","Casa "+r.apt,type,"❌ "+e.message); }
  } else addLog("Email","Casa "+r.apt,type,r.email?"⚠️ Sem Client ID":"⚠️ Sem e-mail");
  if (state.settings.whatsappToken && r.phone) {
    try { await waSend(r.phone, fillTpl(isOverdue?state.settings.waOverdueTpl:state.settings.waReminderTpl, vars)); addLog("WhatsApp","Casa "+r.apt,type,"✅ Enviado"); }
    catch(e) { errors.push(e.message); addLog("WhatsApp","Casa "+r.apt,type,"❌ "+e.message); }
  } else addLog("WhatsApp","Casa "+r.apt,type,r.phone?"⚠️ Sem token":"⚠️ Sem telefone");
  errors.length ? showToast("Erro: "+errors[0],"err") : showToast("Enviado para Casa "+r.apt+"!");
}

// ─── Pluggy ───────────────────────────────────────────────────────────────────
async function pluggyConnect() {
  if (!state.settings.pluggyClientId||!state.settings.pluggyClientSecret) { showToast("Preencha Client ID e Secret nas configurações.","err"); return; }
  setState({connectStep:1});
  try {
    const r = await fetch(PLUGGY_API+"/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({clientId:state.settings.pluggyClientId,clientSecret:state.settings.pluggyClientSecret})});
    if (!r.ok) throw new Error("Credenciais inválidas.");
    const k = (await r.json()).apiKey;
    if (!state.settings.pluggyItemId) { setState({pluggyApiKey:k,connectStep:2}); return; }
    const ar = await fetch(PLUGGY_API+"/accounts?itemId="+state.settings.pluggyItemId,{headers:{"X-API-KEY":k}});
    setState({pluggyApiKey:k, pluggyAccounts:(await ar.json()).results, connectStep:2});
  } catch(e) { setState({connectStep:0}); showToast(e.message,"err"); }
}

async function pluggySync() {
  if (!state.pluggyApiKey||!state.pluggySelAcct) { showToast("Selecione uma conta primeiro.","err"); return; }
  setState({pluggySyncing:true});
  try {
    const from = new Date(state.selYear,state.selMonth,1).toISOString().slice(0,10);
    const to   = new Date(state.selYear,state.selMonth+1,0).toISOString().slice(0,10);
    const tr   = await fetch(PLUGGY_API+"/transactions?accountId="+state.pluggySelAcct+"&from="+from+"&to="+to+"&pageSize=500",{headers:{"X-API-KEY":state.pluggyApiKey}});
    const txs  = (await tr.json()).results||[];
    const matched=[]; const newInv={...state.invoices}; let n=0;
    txs.forEach(tx => {
      if (tx.type!=="CREDIT"&&tx.amount<=0) return;
      const amt = Math.abs(tx.amount);
      const resident = state.residents.find(r=>Math.abs(r.amount-amt)<0.005);
      if (!resident) return;
      const txDate = tx.date?tx.date.slice(0,10):todayStr();
      const key = invKey(resident.id,state.selMonth,state.selYear);
      matched.push({apt:resident.apt,owner:resident.owner,txDate,amount:amt,txId:tx.id});
      newInv[key] = {...(newInv[key]||{residentId:resident.id,month:state.selMonth,year:state.selYear,amount:amt,dueDate:"",notes:""}), status:"paid",paidAt:txDate,txId:tx.id};
      n++;
    });
    setState({pluggyMatches:matched,invoices:newInv,connectStep:3,pluggyLastSync:new Date().toLocaleString("pt-BR"),pluggySyncing:false});
    showToast(n>0?n+" pagamento(s) detectado(s)!":"Nenhum pagamento novo encontrado.");
  } catch(e) { setState({pluggySyncing:false}); showToast(e.message,"err"); }
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
  autoOverdue();
  const isMobile = window.innerWidth < 768;
  const rows = getRows();
  const shown = state.filterSt==="all" ? rows : rows.filter(x=>x.status===state.filterSt);
  const paid    = rows.filter(x=>x.status==="paid").reduce((s,x)=>s+x.amount,0);
  const pending = rows.filter(x=>x.status==="pending").reduce((s,x)=>s+x.amount,0);
  const overdue = rows.filter(x=>x.status==="overdue").reduce((s,x)=>s+x.amount,0);
  const grand   = paid+pending+overdue;
  const paidPct = grand>0?Math.round(paid/grand*100):0;

  const tabs  = ["Início","Banco","Moradores","Alertas","Config."];
  const icons = [
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>`,
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/><path d="M2 11h20"/></svg>`,
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M16 3.13a4 4 0 010 7.75M21 21v-2a4 4 0 00-3-3.87"/></svg>`,
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>`,

window.setState       = setState;
window.showToast      = showToast;

window.pluggySync     = pluggySync;

window.saveSettings = () => saveToFirebase(“settings”, state.settings);

window.changeStatusUI = (key, rid, st) => {
const r = state.residents.find(x=>x.id===rid); if(r) changeStatus(key,r,st);
};

window.openDetail = rid => {
const row = getRows().find(x=>x.r.id===rid);
if (row) setState({detailRow:row});
};

window.openEditRes = rid => {
if (rid) { const r=state.residents.find(x=>x.id===rid); if(r) setState({editRes:{…r}}); }
else setState({editRes:{id:null,apt:””,owner:””,email:””,phone:””,amount:””}});
};

window.saveResident = () => {
const apt = document.getElementById(“er-apt”).value.trim();
if (!apt) { showToast(“Informe o número da casa.”,“err”); return; }
const er = state.editRes;
const data = {id:er.id||Date.now(), apt, owner:document.getElementById(“er-owner”).value, email:document.getElementById(“er-email”).value, phone:document.getElementById(“er-phone”).value, amount:parseFloat(document.getElementById(“er-amount”).value)||er.amount||0};
const residents = er.id ? state.residents.map(r=>r.id===er.id?data:r) : […state.residents,data];
setState({residents, editRes:null});
showToast(“Casa salva! ☁️”);
};

window.removeResident = rid => {
if (!confirm(“Remover esta casa?”)) return;
setState({residents:state.residents.filter(r=>r.id!==rid), editRes:null});
};

window.openAddInvoice = () => setState({modal:“addInvoice”});

window.saveInvoice = () => {
const rid = document.getElementById(“ai-res”).value;
if (!rid) { showToast(“Selecione uma casa.”,“err”); return; }
const r = state.residents.find(x=>x.id===parseInt(rid));
const month=parseInt(document.getElementById(“ai-month”).value), year=parseInt(document.getElementById(“ai-year”).value);
const key = invKey(rid,month,year);
setState({invoices:{…state.invoices,[key]:{residentId:parseInt(rid),month,year,amount:parseFloat(document.getElementById(“ai-amount”).value)||r.amount,dueDate:document.getElementById(“ai-due”).value,status:document.getElementById(“ai-status”).value,notes:document.getElementById(“ai-notes”).value}},modal:null});
showToast(“Lançamento salvo! ☁️”);
};

window.notifyUI = async (rid,type) => {
const row = getRows().find(x=>x.r.id===rid);
if (row) await notify(row,type);
};

window.notifyAllOverdue  = async () => { for(const row of getRows().filter(x=>x.status===“overdue”)) await notify(row,“overdue”); };
window.notifyAllPending  = () => getRows().filter(x=>x.status===“pending”&&x.dueDate).forEach(row=>notify(row,“reminder”));

window.pluggyLoadAccounts = async () => {
try {
const ar = await fetch(PLUGGY_API+”/accounts?itemId=”+state.settings.pluggyItemId,{headers:{“X-API-KEY”:state.pluggyApiKey}});
setState({pluggyAccounts:(await ar.json()).results});
} catch(e) { showToast(e.message,“err”); }
};
