<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Vila Flora</title>
<meta name="theme-color" content="#1a1a2e"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#f0eff4;color:#1a1a2e;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;outline:none;}
.tap:active{opacity:0.7;transform:scale(0.97);}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.07);}
.mono{font-family:monospace;}
.pill{padding:6px 14px;border-radius:999px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
.btn{padding:10px 18px;border-radius:12px;background:#6c63ff;color:#fff;font-weight:700;font-size:13px;}
.lbl{font-size:10px;color:#888;letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:5px;font-weight:700;}
.inp{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid #e8e7f0;background:#f8f8fc;font-size:14px;color:#1a1a2e;margin-bottom:12px;display:block;}
.inp:focus{border-color:#6c63ff;}
.sec{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,0.07);}
.sec-t{font-weight:800;font-size:14px;margin-bottom:14px;border-bottom:1px solid #f0eff4;padding-bottom:10px;}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;}
.ovl{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;}
.ovl-bg{position:absolute;inset:0;background:rgba(0,0,0,0.4);}
.sheet{position:relative;background:#fff;border-radius:22px 22px 0 0;padding:0 20px 36px;width:100%;max-height:88vh;overflow-y:auto;animation:fadeUp 0.2s ease;}
.handle{width:36px;height:4px;background:#e0e0e0;border-radius:999px;margin:12px auto 16px;}
.modal{position:relative;background:#fff;border-radius:20px;padding:28px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;animation:fadeUp 0.2s ease;margin:auto;}
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;z-index:100;}
.nav-btn{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#aaa;font-size:9px;font-weight:700;}
.nav-btn.on{color:#6c63ff;}
.sidebar{width:220px;background:#1a1a2e;color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:10;}
.topbar{background:#fff;border-bottom:1px solid #eee;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
table{width:100%;border-collapse:collapse;}
th{padding:11px 14px;text-align:left;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#a78bfa;background:#1a1a2e;}
td{padding:11px 14px;border-top:1px solid #f4f4f8;font-size:13px;}
tr:hover td{background:#f5f3ff;cursor:pointer;}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:999;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;display:none;white-space:nowrap;max-width:90vw;}
@media(max-width:767px){.desk{display:none!important;}}
@media(min-width:768px){.mob{display:none!important;}.main{margin-left:220px;}}
</style>
</head>
<body>
<div id="toast"></div>
<div id="root"></div>
<script>
var MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
var MONTHS_S = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
var CUR_YEAR = new Date().getFullYear();
var ST = {
  paid:    {bg:"#dcfce7",tx:"#14532d",dot:"#22c55e",lb:"Pago",    ic:"✓"},
  pending: {bg:"#fef9c3",tx:"#713f12",dot:"#eab308",lb:"Pendente",ic:"⏳"},
  overdue: {bg:"#fee2e2",tx:"#7f1d1d",dot:"#ef4444",lb:"Atrasado",ic:"!"}
};
var INIT_RES = [
  {id:1,apt:"1",owner:"",email:"",phone:"",amount:300.01},
  {id:2,apt:"2",owner:"",email:"",phone:"",amount:300.02},
  {id:3,apt:"3",owner:"",email:"",phone:"",amount:300.03},
  {id:4,apt:"4",owner:"",email:"",phone:"",amount:300.04},
  {id:5,apt:"5",owner:"",email:"",phone:"",amount:300.05},
  {id:6,apt:"6",owner:"",email:"",phone:"",amount:300.06},
  {id:7,apt:"7",owner:"",email:"",phone:"",amount:300.07},
  {id:8,apt:"8",owner:"",email:"",phone:"",amount:300.08},
  {id:9,apt:"9",owner:"",email:"",phone:"",amount:300.09},
  {id:10,apt:"10",owner:"",email:"",phone:"",amount:300.10}
];
var DEF_SET = {
  senderName:"Administração Vila Flora",
  emailReminderTpl:"Olá {nome},\n\nLembrete: sua taxa de {valor} vence em {vencimento}.\n\nAtenciosamente,\n{remetente}",
  emailOverdueTpl:"Olá {nome},\n\nSua taxa de {valor} está em ATRASO desde {vencimento}.\n\nAtenciosamente,\n{remetente}",
  waReminderTpl:"Olá {nome}! 👋\n\nTaxa de *{valor}* vence em *{vencimento}*.\n_{remetente}_",
  waOverdueTpl:"Olá {nome}! ⚠️\n\nTaxa de *{valor}* em *ATRASO* desde *{vencimento}*.\n_{remetente}_",
  gmailClientId:"", whatsappToken:"", whatsappPhoneId:""
};
function ls(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var S = {
  tab:0,
  residents: ls("vf-res", INIT_RES),
  invoices:  ls("vf-inv", {}),
  settings:  Object.assign({}, DEF_SET, ls("vf-set", {})),
  notifLog:  ls("vf-log", []),
  selMonth: new Date().getMonth(),
  selYear: CUR_YEAR,
  filter:"all",
  modal:null, editRes:null, detailRow:null
};
function save(){
  lss("vf-res", S.residents);
  lss("vf-inv", S.invoices);
  lss("vf-set", S.settings);
  lss("vf-log", S.notifLog);
}
function set(patch){Object.assign(S,patch);save();render();}
var fmt = function(n){return "R$ "+Number(n).toLocaleString("pt-BR",{minimumFractionDigits:2});};
var ikey = function(rid,m,y){return rid+"-"+m+"-"+y;};
var today = function(){return new Date().toISOString().slice(0,10);};
var ddiff = function(d){return d?Math.floor((new Date(today())-new Date(d))/86400000):null;};
var fdate = function(d){return d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR"):"—";};
var esc = function(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");};
var fill = function(t,v){return Object.entries(v).reduce(function(s,kv){return s.split("{"+kv[0]+"}").join(kv[1]);},t);};
function toast(msg,type){
  var el=document.getElementById("toast");
  el.textContent=msg; el.style.background=type==="err"?"#7f1d1d":"#14532d";
  el.style.color="#fff"; el.style.display="block";
  clearTimeout(el._t); el._t=setTimeout(function(){el.style.display="none";},3500);
}
function getRows(){
  return S.residents.map(function(r){
    var k=ikey(r.id,S.selMonth,S.selYear), inv=S.invoices[k];
    return {r:r,k:k,inv:inv,st:inv?inv.status:"pending",amt:inv?inv.amount:r.amount,due:inv?inv.dueDate:"",notes:inv?inv.notes:""};
  });
}
function chgSt(k,r,st){
  var inv=S.invoices[k]||{residentId:r.id,month:S.selMonth,year:S.selYear,amount:r.amount,dueDate:"",notes:""};
  S.invoices[k]=Object.assign({},inv,{status:st});
  save(); render();
}
function autoOverdue(){
  var changed=false;
  Object.keys(S.invoices).forEach(function(k){
    var inv=S.invoices[k];
    if(inv.status==="pending"&&inv.dueDate&&ddiff(inv.dueDate)>0){S.invoices[k]=Object.assign({},inv,{status:"overdue"});changed=true;}
  });
  if(changed)save();
}
function navIcons(){
  return [
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M16 3.13a4 4 0 010 7.75M21 21v-2a4 4 0 00-3-3.87"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>'
  ];
}
function render(){
  autoOverdue();
  var mob=window.innerWidth<768;
  var rows=getRows();
  var shown=S.filter==="all"?rows:rows.filter(function(x){return x.st===S.filter;});
  var paid=rows.filter(function(x){return x.st==="paid";}).reduce(function(s,x){return s+x.amt;},0);
  var pend=rows.filter(function(x){return x.st==="pending";}).reduce(function(s,x){return s+x.amt;},0);
  var over=rows.filter(function(x){return x.st==="overdue";}).reduce(function(s,x){return s+x.amt;},0);
  var grand=paid+pend+over;
  var pct=grand>0?Math.round(paid/grand*100):0;
  var tabs=["Início","Moradores","Alertas","Config."];
  var icons=navIcons();

function summaryCards(){
return [
{l:“Total”,v:fmt(grand),c:”#6c63ff”,bg:”#f5f3ff”,s:rows.length+” casas”},
{l:“Pago”,v:fmt(paid),c:”#22c55e”,bg:”#f0fdf4”,s:rows.filter(function(x){return x.st===“paid”;}).length+” pagas”},
{l:“Pendente”,v:fmt(pend),c:”#eab308”,bg:”#fefce8”,s:rows.filter(function(x){return x.st===“pending”;}).length+” pend.”},
{l:“Atrasado”,v:fmt(over),c:”#ef4444”,bg:”#fef2f2”,s:rows.filter(function(x){return x.st===“overdue”;}).length+” atr.”}
].map(function(c){
return ‘<div class="card" style="background:'+c.bg+';padding:14px 16px">’+
‘<div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;color:'+c.c+';margin-bottom:5px;font-weight:700">’+c.l+’</div>’+
‘<div class=“mono” style=“font-size:’+(mob?“14px”:“19px”)+’;font-weight:900;color:’+c.c+’”>’+c.v+’</div>’+
‘<div style="font-size:11px;color:#aaa;margin-top:2px">’+c.s+’</div></div>’;
}).join(””);
}

function invoiceCards(){
if(!shown.length) return ‘<div style="text-align:center;padding:40px;color:#aaa">Nenhum registro.</div>’;
return shown.map(function(row){
var sc=ST[row.st], od=row.st===“overdue”&&row.due?ddiff(row.due):null;
return ‘<div class="card tap" onclick="openDetail('+row.r.id+')" style="padding:13px 15px;display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer">’+
‘<div style=“width:42px;height:42px;border-radius:12px;background:’+(row.st===“paid”?”#f0fdf4”:row.st===“overdue”?”#fef2f2”:”#fefce8”)+’;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;font-weight:900;color:’+sc.dot+’”>’+sc.ic+’</div>’+
‘<div style="flex:1;min-width:0">’+
‘<div style="font-weight:800;font-size:14px">Casa ‘+esc(row.r.apt)+’</div>’+
‘<div style="font-size:12px;color:#888">’+esc(row.r.owner||”—”)+’</div>’+
(row.due?’<div style=“font-size:11px;color:’+(od&&od>0?”#ef4444”:”#aaa”)+’”>’+(od&&od>0?od+“d em atraso”:“Vence “+fdate(row.due))+’</div>’:””)+
‘</div>’+
‘<div style="text-align:right;flex-shrink:0">’+
‘<div class="mono" style="font-weight:700;font-size:13px">’+fmt(row.amt)+’</div>’+
‘<span class="badge" style="background:'+sc.bg+';color:'+sc.tx+';margin-top:4px">’+sc.lb+’</span>’+
‘</div></div>’;
}).join(””);
}

function invoiceTable(){
return ‘<div class="card" style="overflow:hidden"><table>’+
‘<thead><tr><th>Casa</th><th>Morador</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Alterar</th></tr></thead>’+
‘<tbody>’+(shown.length===0?’<tr><td colspan="6" style="text-align:center;color:#aaa;padding:30px">Nenhum registro.</td></tr>’:””)+
shown.map(function(row){
var sc=ST[row.st], od=row.st===“overdue”&&row.due?ddiff(row.due):null;
return ‘<tr onclick="openDetail('+row.r.id+')">’+
‘<td style="font-weight:800">Casa ‘+esc(row.r.apt)+’</td>’+
‘<td style="color:#555">’+esc(row.r.owner||”—”)+’</td>’+
‘<td class="mono" style="font-weight:600">’+fmt(row.amt)+’</td>’+
‘<td style=“color:’+(od&&od>0?”#ef4444”:”#888”)+’”>’+fdate(row.due)+(od&&od>0?’<div style="font-size:10px;color:#ef4444">’+od+‘d</div>’:””)+”</td>”+
‘<td onclick="event.stopPropagation()"><span class="badge" style="background:'+sc.bg+';color:'+sc.tx+'">’+sc.lb+’</span></td>’+
‘<td onclick="event.stopPropagation()"><div style="display:flex;gap:4px">’+
[“paid”,“pending”,“overdue”].map(function(s){
return ‘<button class=“tap” onclick=“chgSt('’+row.k+’',’+row.r.id+’,'’+s+’')” style=“padding:4px 7px;border-radius:7px;font-size:10px;background:’+(row.st===s?ST[s].dot:”#f0eff4”)+’;color:’+(row.st===s?”#fff”:”#777”)+’;font-weight:700”>’+ST[s].lb+’</button>’;
}).join(””)+
‘</div></td></tr>’;
}).join(””)+
‘</tbody></table></div>’;
}

function tabHome(){
return ‘<div style=“padding:’+(mob?“14px 14px 90px”:“28px 28px”)+’”>’ +
‘<div style=“display:grid;grid-template-columns:’+(mob?“1fr 1fr”:“repeat(4,1fr)”)+’;gap:12px;margin-bottom:16px”>’+summaryCards()+’</div>’+
‘<div class="card" style="padding:14px 18px;margin-bottom:16px">’+
‘<div style="display:flex;justify-content:space-between;margin-bottom:8px">’+
‘<span style="font-weight:700;font-size:13px">’+MONTHS[S.selMonth]+’ ‘+S.selYear+’</span>’+
‘<span class="mono" style="font-weight:900;font-size:13px;color:#6c63ff">’+pct+’% arrecadado</span>’+
‘</div>’+
‘<div style="height:10px;background:#f0eff4;border-radius:999px;overflow:hidden;display:flex">’+
‘<div style="width:'+( grand>0?paid/grand*100:0)+'%;background:#22c55e;transition:width 0.5s"></div>’+
‘<div style="width:'+(grand>0?pend/grand*100:0)+'%;background:#eab308;transition:width 0.5s"></div>’+
‘<div style="width:'+(grand>0?over/grand*100:0)+'%;background:#ef4444;transition:width 0.5s"></div>’+
‘</div>’+
‘</div>’+
‘<div style="display:flex;gap:7px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px">’+
MONTHS_S.map(function(m,i){return ‘<button class=“tap pill” onclick=“set({selMonth:’+i+’})” style=“background:’+(S.selMonth===i?”#6c63ff”:”#e8e7f0”)+’;color:’+(S.selMonth===i?”#fff”:”#888”)+’”>’+m+’</button>’;}).join(””)+
‘</div>’+
‘<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">’+
‘<div style="display:flex;gap:6px">’+
[CUR_YEAR-1,CUR_YEAR,CUR_YEAR+1].map(function(y){return ‘<button class=“tap pill” onclick=“set({selYear:’+y+’})” style=“background:’+(S.selYear===y?”#1a1a2e”:”#e8e7f0”)+’;color:’+(S.selYear===y?”#fff”:”#888”)+’”>’+y+’</button>’;}).join(””)+
‘</div>’+
‘<button class="tap btn" onclick="set({modal:\'addInv\'})">+ Lançar</button>’+
‘</div>’+
‘<div style="display:flex;gap:7px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px">’+
[“all”,“paid”,“pending”,“overdue”].map(function(s){
var cnt=s===“all”?rows.length:rows.filter(function(x){return x.st===s;}).length;
return ‘<button class=“tap pill” onclick=“set({filter:'’+s+’'})” style=“background:’+(S.filter===s?”#1a1a2e”:”#e8e7f0”)+’;color:’+(S.filter===s?”#fff”:”#888”)+’”>’+
(s===“all”?“Todas”:ST[s].lb)+’ (’+cnt+’)</button>’;
}).join(””)+
‘</div>’+
(mob?invoiceCards():invoiceTable())+
(rows.filter(function(x){return x.st===“overdue”;}).length>0?
‘<button class="tap" onclick="notifyAll(\'overdue\')" style="width:100%;margin-top:14px;padding:13px;border-radius:14px;background:#7f1d1d;color:#fff;font-size:13px;font-weight:800">’+
‘⚠️ Notificar Todos em Atraso (’+rows.filter(function(x){return x.st===“overdue”;}).length+’)</button>’:””)+
‘</div>’;
}

function tabMoradores(){
return ‘<div style=“padding:’+(mob?“14px 14px 90px”:“28px 28px”)+’”>’+
‘<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">’+
‘<h2 style=“font-size:’+(mob?“18px”:“22px”)+’;font-weight:900”>Moradores</h2>’+
‘<button class="tap btn" onclick="openEditRes(null)">+ Nova Casa</button>’+
‘</div>’+
‘<div style=“display:grid;grid-template-columns:’+(mob?“1fr”:“repeat(auto-fill,minmax(280px,1fr))”)+’;gap:14px”>’+
S.residents.map(function(r){
return ‘<div class="card tap" onclick="openEditRes('+r.id+')" style="padding:18px;cursor:pointer">’+
‘<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">’+
‘<div><div style="font-weight:800;font-size:15px">Casa ‘+esc(r.apt)+’</div><div style="font-size:12px;color:#888;margin-top:2px">’+esc(r.owner||“Sem nome”)+’</div></div>’+
‘<div class="mono" style="font-weight:800;font-size:14px;color:#6c63ff">’+fmt(r.amount)+’</div>’+
‘</div>’+
‘<div style="display:flex;flex-direction:column;gap:7px">’+
‘<div style="display:flex;align-items:center;gap:8px;background:#f8f8fc;border-radius:9px;padding:7px 10px">’+
‘<span>📧</span><span style=“font-size:11px;color:’+(r.email?”#333”:”#ccc”)+’;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1”>’+esc(r.email||“Não cadastrado”)+’</span>’+
(!r.email?’<span style="font-size:9px;background:#fef9c3;color:#854d0e;border-radius:4px;padding:2px 5px;font-weight:700;flex-shrink:0">!</span>’:””)+
‘</div>’+
‘<div style="display:flex;align-items:center;gap:8px;background:#f8f8fc;border-radius:9px;padding:7px 10px">’+
‘<span>📱</span><span style=“font-size:11px;color:’+(r.phone?”#333”:”#ccc”)+’;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1”>’+esc(r.phone||“Não cadastrado”)+’</span>’+
(!r.phone?’<span style="font-size:9px;background:#fef9c3;color:#854d0e;border-radius:4px;padding:2px 5px;font-weight:700;flex-shrink:0">!</span>’:””)+
‘</div>’+
‘</div></div>’;
}).join(””)+
‘</div></div>’;
}

function tabAlertas(){
return ‘<div style=“padding:’+(mob?“14px 14px 90px”:“28px 28px”)+’”>’+
‘<h2 style=“font-size:’+(mob?“18px”:“22px”)+’;font-weight:900;margin-bottom:16px”>Notificações</h2>’+

window.set = set;
window.chgSt = function(k,rid,st){var r=S.residents.find(function(x){return x.id===rid;});if(r)chgSt(k,r,st);};

window.openEditRes = function(rid){if(rid){var r=S.residents.find(function(x){return x.id===rid;});if(r)set({editRes:Object.assign({},r)});}else{set({editRes:{id:null,apt:””,owner:””,email:””,phone:””,amount:””}});}};
window.saveResident = function(){
var apt=document.getElementById(“er-apt”).value.trim();
if(!apt){toast(“Informe o número da casa.”,“err”);return;}
var er=S.editRes;
var data={id:er.id||Date.now(),apt:apt,owner:document.getElementById(“er-own”).value,email:document.getElementById(“er-eml”).value,phone:document.getElementById(“er-phn”).value,amount:parseFloat(document.getElementById(“er-amt”).value)||er.amount||0};
var res=er.id?S.residents.map(function(r){return r.id===er.id?data:r;}):S.residents.concat([data]);
set({residents:res,editRes:null});
toast(“Casa salva!”);
};
window.removeResident = function(rid){if(!confirm(“Remover esta casa?”))return;set({residents:S.residents.filter(function(r){return r.id!==rid;}),editRes:null});};
window.saveInvoice = function(){
var rid=document.getElementById(“ai-res”).value;
if(!rid){toast(“Selecione uma casa.”,“err”);return;}
var r=S.residents.find(function(x){return x.id===parseInt(rid);});
var m=parseInt(document.getElementById(“ai-mon”).value);
var y=parseInt(document.getElementById(“ai-yr”).value);
var k=ikey(rid,m,y);
var inv={residentId:parseInt(rid),month:m,year:y,amount:parseFloat(document.getElementById(“ai-amt”).value)||r.amount,dueDate:document.getElementById(“ai-due”).value,status:document.getElementById(“ai-st”).value,notes:document.getElementById(“ai-nt”).value};
S.invoices[k]=inv; save(); set({modal:null});
toast(“Lançamento salvo!”);
};
window.saveSettings = function(){
var gc=document.getElementById(“gc”),wt=document.getElementById(“wt”),wp=document.getElementById(“wp”),sn=document.getElementById(“sn”);
var er=document.getElementById(“er”),eo=document.getElementById(“eo”),wr=document.getElementById(“wr”),wo=document.getElementById(“wo”);
S.settings.gmailClientId=gc?gc.value:””;
S.settings.whatsappToken=wt?wt.value:””;
S.settings.whatsappPhoneId=wp?wp.value:””;
S.settings.senderName=sn?sn.value:S.settings.senderName;
var er2=document.getElementById(“er”),eo2=document.getElementById(“eo”),wr2=document.getElementById(“wr”),wo2=document.getElementById(“wo”);
if(er2)S.settings.emailReminderTpl=er2.value;
if(eo2)S.settings.emailOverdueTpl=eo2.value;
if(wr2)S.settings.waReminderTpl=wr2.value;
if(wo2)S.settings.waOverdueTpl=wo2.value;
save(); toast(“Configurações salvas!”);
};
window.notifyRow = function(rid,type){
var rows=getRows();var row=rows.find(function(x){return x.r.id===rid;});
if(!row)return;
var vars={nome:row.r.owner,valor:fmt(row.amt),vencimento:fdate(row.due),remetente:S.settings.senderName};
var isOverdue=type===“overdue”;
var log={id:Date.now(),ts:new Date().toLocaleString(“pt-BR”),res:“Casa “+row.r.apt,type:type};
if(S.settings.gmailClientId&&row.r.email){log.ch=“Email”;log.st=“⏳ Enviando. . .”;}
else{log.ch=“Email”;log.st=row.r.email?“⚠️ Sem Client ID”:“⚠️ Sem e-mail”;}
S.notifLog=[log,. . .S.notifLog].slice(0,200);
save(); render();
toast(“Notificação registrada para Casa “+row.r.apt+”!”);
};
window.notifyAll = function(type){
var rows=getRows();
var targets=type===“overdue”?rows.filter(function(x){return x.st===“overdue”;}):rows.filter(function(x){return x.st===“pending”&&x.due;});
targets.forEach(function(row){notifyRow(row.r.id,type===“overdue”?“overdue”:“reminder”);});
};
window.addEventListener(“resize”,render);
try {
render();
} catch(e) {
document.getElementById(“root”).innerHTML = ‘<div style="padding:30px;font-family:monospace;background:#fee2e2;color:#7f1d1d;border-radius:12px;margin:20px;font-size:13px"><strong>Erro:</strong> ‘+e.message+’<br/><br/>’+e.stack+’</div>’;
}
